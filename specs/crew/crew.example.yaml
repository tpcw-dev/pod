kind: crew
name: crew.example
schema_version: 1
value:
  seats:
    # Fill id, runtime, model, and host before this seat is used.
    - id: developer
      roles: [developer]
      runtime: example
      model: example
      host: example-host
    # Fill id, runtime, model, and host before this seat is used.
    - id: reviewer
      roles: [reviewer]
      runtime: example
      model: example
      host: example-host
    # Fill id, runtime, model, and host before this seat is used.
    - id: coordinator
      roles: [coordinator]
      runtime: example
      model: example
      host: example-host
    # Fill id, runtime, model, and host before this seat is used.
    - id: decider
      roles: [decider]
      runtime: example
      model: example
      host: example-host
      fallback: decider-fallback
    # Fill id, runtime, model, and host before this seat is used.
    - id: decider-fallback
      roles: [decider-fallback]
      runtime: example
      model: example
      host: example-host
    # Fill id, runtime, model, and host before this seat is used.
    - id: auditor
      roles: [auditor]
      runtime: example
      model: example
      host: example-host
      independent_of: [decider, decider-fallback]
      fallback: auditor-fallback
    # Fill id, runtime, model, and host before this seat is used.
    - id: auditor-fallback
      roles: [auditor-fallback]
      runtime: example
      model: example
      host: example-host
      independent_of: [decider, decider-fallback]
