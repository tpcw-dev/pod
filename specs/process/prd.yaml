kind: process
name: prd
schema_version: 1
value:
  summary: prd stage, a writer drafts, an independent auditor audits, a person keeps prd review
  selector: { stage: prd }
  roles: [writer, auditor]
  steps:
    - { id: draft, type: worker, role: writer, produces: [document] }
    - { id: audit, type: worker, role: auditor, needs: [draft], gate: audit }
    - { id: prd_review, type: human_wait, needs: [audit], gate: prd_review }
  edges:
    - { from: draft, on: done, to: audit }
    - { from: draft, on: [timeout, cancel, unknown], to: hold }
    - { from: audit, on: PASS, to: prd_review }
    - { from: audit, on: FAIL, to: draft, new_task: true, then: audit }
    - { from: audit, on: [timeout, cancel, unknown], to: hold }
    - { from: prd_review, on: PASS, to: done }
    - { from: prd_review, on: FAIL, to: draft, new_task: true, then: audit }
    - { from: prd_review, on: cancel, to: hold }
  limits: { attempts_per_task: 3, rework_per_lineage: 3 }
  escalation: { to: decision-pair }
