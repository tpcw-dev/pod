kind: process
name: impl-xlarge
schema_version: 1
value:
  summary: xl impl, the coordinator pair agrees the plan in a Decision round, several developer Tasks, a review per Task and of the integrated candidate, one PR
  selector: { stage: impl, size: [xl] }
  roles: [planner, developer, reviewer]
  steps:
    - { id: plan, type: worker, role: planner, produces: [plan], decision: plan }
    - id: implement
      type: worker
      role: developer
      needs: [plan]
      produces: [commit]
      spec: "Several Tasks, one per slice of the plan."
    - { id: review, type: worker, role: reviewer, needs: [implement], gate: review }
    - { id: integration_review, type: worker, role: reviewer, needs: [review], gate: integration_review, binds: candidate_sha }
    - { id: pr, type: worker, role: developer, needs: [integration_review], produces: [pr] }
    - { id: merge, type: human_wait, needs: [pr], gate: merge }
    - id: deploy
      type: external_action
      needs: [merge]
      adapter: deploy
      event_fields: [environment, deployment_id, deployed_revision, source_commit]
    - { id: hqa, type: human_wait, needs: [deploy], gate: hqa_after_deploy, binds: deployed_revision }
  edges:
    - { from: plan, on: agreed, to: implement }
    - { from: plan, on: cancelled, to: hold }
    - { from: plan, on: [timeout, cancel, unknown], to: hold }
    - { from: implement, on: done, to: review }
    - { from: implement, on: [timeout, cancel, unknown], to: hold }
    - { from: review, on: PASS, to: integration_review }
    - { from: review, on: FAIL, to: implement, new_task: true, then: review }
    - { from: review, on: [timeout, cancel, unknown], to: hold }
    - { from: integration_review, on: PASS, to: pr }
    - { from: integration_review, on: FAIL, to: implement, new_task: true, then: review }
    - { from: integration_review, on: [timeout, cancel, unknown], to: hold }
    - { from: pr, on: done, to: merge }
    - { from: pr, on: [timeout, cancel, unknown], to: hold }
    - { from: merge, on: PASS, to: deploy }
    - { from: merge, on: [FAIL, cancel], to: hold }
    - { from: deploy, on: done, to: hqa }
    - { from: deploy, on: [unknown, cancel], to: hold }
    - { from: hqa, on: PASS, to: done }
    - { from: hqa, on: FAIL, to: implement, new_task: true, then: review }
    - { from: hqa, on: cancel, to: hold }
  limits: { attempts_per_task: 3, rework_per_lineage: 3 }
  escalation: { to: decision-pair }
