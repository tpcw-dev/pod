name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pod
          POSTGRES_PASSWORD: pod
          POSTGRES_DB: pod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pod -d pod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POD_DB_TEST_URL: postgres://pod:pod@localhost:5432/pod
      POD_DB_URL: postgres://pod:pod@localhost:5432/pod
      POD_DB_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5.2.2
      - run: pg_dump --version
      - run: pnpm install --frozen-lockfile
      - name: scope scan
        env:
          DENYLIST: ${{ secrets.POD_SCRUB_DENYLIST }}
        run: |
          printf '%s\n' "$DENYLIST" | grep -v '^[[:space:]]*$' > "$RUNNER_TEMP/denylist" || true
          test -s "$RUNNER_TEMP/denylist" || { echo "POD_SCRUB_DENYLIST is empty"; exit 1; }
          if grep -rlwiF -f "$RUNNER_TEMP/denylist" fixtures docs src/db/schema test/db/takeover-unsafe; then exit 1; fi
          if grep -rlE '/(home|Users)/|~/' fixtures/orca fixtures/tracker fixtures/docs test/db/takeover-unsafe; then exit 1; fi
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec tsx src/cli/index.ts db migrate
      - run: pnpm exec tsx src/cli/index.ts db migrate
